[YouTube-Morphe]
enabled = true
app-name = "YouTube"
build-mode = "both"
pkg-name = "com.google.android.youtube"
included-patches = "'Theme'"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube"
apkpure-dlurl = "https://apkpure.com/youtube-app/com.google.android.youtube"
apkcombo-dlurl = "https://apkcombo.com/youtube/com.google.android.youtube"

# ── YouTube morphe-amoled (#000000) ───────────────────────────────────────────


[YouTube-Morphe-Experimental]
enabled = true
app-name = "YouTube"
sub-variant = "Experimental"
build-mode = "both"
version = "exp"
pkg-name = "com.google.android.youtube"
included-patches = "'Theme'"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube"
apkpure-dlurl = "https://apkpure.com/youtube-app/com.google.android.youtube"
apkcombo-dlurl = "https://apkcombo.com/youtube/com.google.android.youtube"

[YouTube-Morphe-Anddea]
enabled = true
app-name = "YouTube"
build-mode = "both"
pkg-name = "com.google.android.youtube"
included-patches = "'MaterialYou'"
patcher-args = "-e 'Theme' -OdarkThemeBackgroundColor=@android:color/black --continue-on-error"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube"

# ── YouTube morphe-anddea-amoled (#000000 explicit) ───────────────────────────


[YouTube-Morphe-Anddea-AMOLED]
enabled = true
app-name = "YouTube"
variant = "AMOLED"
build-mode = "both"
pkg-name = "com.google.android.youtube"
included-patches = "'MaterialYou'"
patcher-args = "-e 'Theme' -OdarkThemeBackgroundColor=#000000 -OlightThemeBackgroundColor=#FFFFFF --continue-on-error"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube"

