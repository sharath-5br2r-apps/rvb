patches-source = "dh6k/morphe-patches"
brand = "dh6k"

[BraveBrowser-dh6k-Beta]
enabled = true
pkg-name = "com.brave.browser_beta"
app-name = "Brave Browser"
variant = "Beta"
apkmirror-dlurl = "https://www.apkmirror.com/apk/brave-software/brave-browser-beta"
uptodown-dlurl = "https://brave-browser-beta.en.uptodown.com/android"
apkpure-dlurl = "https://apkpure.com/brave-browser-beta/com.brave.browser_beta"
apkcombo-dlurl = "https://apkcombo.com/brave-beta/com.brave.browser_beta"
github-dlurl = "https://github.com/brave/brave-browser"
github-regex = 'arm64-v8a: BraveMonoarm64\.apk | arm-v7a: BraveMonoarm\.apk'

[BraveBrowser-dh6k-Nightly]
enabled = true
pkg-name = "com.brave.browser_nightly"
app-name = "Brave Browser"
variant = "Nightly"
apkmirror-dlurl = "https://www.apkmirror.com/apk/brave-software/brave-browser-nightly"
uptodown-dlurl = "https://brave-browser-nightly.en.uptodown.com/android"
apkpure-dlurl = "https://apkpure.com/brave-nightly/com.brave.browser_nightly"
apkcombo-dlurl = "https://apkcombo.com/brave-nightly/com.brave.browser_nightly"
github-dlurl = "https://github.com/brave/brave-browser"
github-regex = 'arm64-v8a: BraveMonoarm64\.apk | arm-v7a: BraveMonoarm\.apk'

[TitaniumBrowser-dh6k]
enabled = true
pkg-name = "io.github.jqssun.helium"
app-name = "Titanium Browser"
included-patches = "'Keep Titanium Extensions Child Processes Alive' 'Force highest refresh rate'"
apkpure-dlurl = "https://apkpure.com/helium-browser/io.github.jqssun.helium"
apkcombo-dlurl = "https://apkcombo.com/titanium-browser/io.github.jqssun.helium"

[BraveBrowser-Beta-Dh6k]
enabled = true
app-name = "Brave Browser"
patch-brand = "Dh6k"
sub-variant = "Beta"
version = "beta"
arch = "arm64-v8a x86_64 armeabi-v7a x86"
pkg-name = "com.brave.browser_beta"
patches-source = "dh6k/morphe-patches"
patcher-args = "--continue-on-error"
github-dlurl = "https://github.com/brave/brave-browser/releases"
github-asset-regex = "arm64-v8a: BraveMonoarm64\\.apk$ | armeabi-v7a: BraveMonoarm\\.apk$ | x86_64: BraveMonox64\\.apk$ | x86: BraveMonox86\\.apk$"
github-release-name-regex = "^Beta v"

[BraveBrowser-Nightly-Dh6k]
enabled = true
app-name = "Brave Browser"
patch-brand = "Dh6k"
sub-variant = "Nightly"
version = "beta"
arch = "arm64-v8a x86_64 armeabi-v7a x86"
pkg-name = "com.brave.browser_nightly"
patches-source = "dh6k/morphe-patches"
patcher-args = "--continue-on-error"
github-dlurl = "https://github.com/brave/brave-browser/releases"
github-asset-regex = "arm64-v8a: BraveMonoarm64\\.apk$ | armeabi-v7a: BraveMonoarm\\.apk$ | x86_64: BraveMonox64\\.apk$ | x86: BraveMonox86\\.apk$"
github-release-name-regex = "^Nightly v"
